name: my_flutter_web
description: >
  AICOM Group Website and Admin Panel
  Built with Flutter Web + Flask Backend Integration.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.6.0'

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Routing đẹp không có '#' cho Flutter Web
  url_strategy: ^0.2.0

  # 🌍 Gọi API đơn giản (nếu không dùng Dio)
  http: ^1.2.0

  # ⚙️ Gọi API nâng cao (có interceptor, cookie, upload, error)
  dio: ^5.4.0
  cookie_jar: ^4.0.0
  dio_cookie_manager: ^3.0.0

  # 🎨 Hiển thị icon SVG và Material icons
  flutter_svg: ^2.0.10+1

  # 💾 Lưu dữ liệu cục bộ (user info, settings...)
  shared_preferences: ^2.3.1

  # 🧭 Hỗ trợ navigation nâng cao (optional)
  flutter_web_plugins:
    sdk: flutter

  # 📁 Chọn file để upload ảnh/video
  file_picker: ^8.0.2
  image_picker_for_web: ^3.0.4

  # 👁️ Theo dõi widget hiển thị trong viewport
  visibility_detector: ^0.3.3

  # 🧰 Tiện ích bổ trợ chung
  intl: ^0.19.0
  provider: ^6.1.2

  # 📂 Nếu bạn dùng để lưu tạm file trên local (cho web cũng hoạt động)
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_web_plugins:
  plugin:
    platforms:
      web:
        pluginClass: FlutterWebPlugins
        fileName: flutter_web_plugins.dart

